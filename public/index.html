<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<meta name="theme-color" content="#dbe8d4" />
<title>Smart Garden</title>
<style>
  :root{
    --bg1:#e9f1e3; --bg2:#d3e6cb;
    --card:#ffffff; --ink:#2b3a2e; --muted:#8aa08e;
    --green:#6fbf73; --green-d:#4f9a54;
    --blue:#6fb1e0; --amber:#f0a35e; --dark:#33413a;
    --radius:26px; --shadow:0 10px 30px rgba(60,90,60,.12);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);
    background:radial-gradient(120% 90% at 50% 0%,var(--bg1),var(--bg2));
    min-height:100vh; padding:18px; display:flex; justify-content:center;
  }
  .app{width:100%;max-width:430px}

  /* top bar */
  .top{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 16px}
  .hello{font-size:.8rem;color:var(--muted)}
  .hello b{display:block;font-size:1.15rem;color:var(--ink);margin-top:2px}
  .badge{display:flex;align-items:center;gap:6px;font-size:.72rem;font-weight:700;
    padding:7px 12px;border-radius:999px;background:#fff;box-shadow:var(--shadow)}
  .dot{width:8px;height:8px;border-radius:50%;background:#c7d2cb}
  .badge.live .dot{background:var(--green);box-shadow:0 0 0 4px rgba(111,191,115,.25)}
  .badge.demo .dot{background:var(--amber)}

  /* hero */
  .hero{position:relative;background:var(--card);border-radius:var(--radius);
    padding:22px 22px 10px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:14px}
  .hero .title{font-size:1.45rem;font-weight:800;letter-spacing:-.02em}
  .hero .sub{color:var(--muted);font-size:.82rem;margin-top:2px}
  .scene{height:210px;display:flex;align-items:flex-end;justify-content:center;position:relative}
  .glow{position:absolute;top:6px;left:50%;transform:translateX(-50%);
    width:200px;height:200px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,236,170,.55),transparent 62%);}

  /* plant */
  .plant{transform-origin:50% 100%;transition:filter .6s}
  .leaf{transform-origin:8px 62px;transition:transform .8s ease,fill .8s ease}
  .sway .stem,.sway .leaf-wrap{animation:sway 4.2s ease-in-out infinite alternate}
  .leaf-wrap{transform-origin:50% 100%}
  @keyframes sway{from{transform:rotate(-2.2deg)}to{transform:rotate(2.2deg)}}
  .drop{position:absolute;top:60px;left:50%;width:9px;height:12px;
    background:var(--blue);border-radius:0 60% 60% 60%;transform:rotate(45deg);opacity:0;}
  .watering .drop{animation:fall 1.1s linear infinite}
  .watering .drop:nth-child(2){animation-delay:.5s;margin-left:16px}
  .watering .drop:nth-child(3){animation-delay:.8s;margin-left:-18px}
  @keyframes fall{0%{opacity:0;top:60px}20%{opacity:.9}100%{opacity:0;top:150px}}

  /* face + moods */
  .face .eye{fill:#3a4a3e;transition:transform .4s}
  .face .mouth{fill:none;stroke:#3a4a3e;stroke-width:2.2;stroke-linecap:round;transition:d .5s}
  .face .cheek{fill:#f5a8b2;opacity:0;transition:opacity .5s}
  .plant.happy .cheek{opacity:.8}
  .plant.happy{animation:bounce 2.6s ease-in-out infinite}
  @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  .spark{position:absolute;color:#ffcf5b;font-size:15px;opacity:0;pointer-events:none;
    text-shadow:0 0 6px rgba(255,207,91,.7)}
  #sp1{top:34px;left:38%} #sp2{top:66px;right:34%} #sp3{top:22px;right:40%}
  .happy-scene .spark{animation:twinkle 1.9s ease-in-out infinite}
  .happy-scene #sp2{animation-delay:.7s} .happy-scene #sp3{animation-delay:1.2s}
  @keyframes twinkle{0%,100%{opacity:0;transform:scale(.5)}50%{opacity:1;transform:scale(1.1)}}
  .mood{text-align:center;font-weight:700;font-size:.92rem;margin:-4px 0 8px;transition:color .4s}

  /* metric pills */
  .pills{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
  .pill{background:var(--card);border-radius:22px;padding:14px 16px;box-shadow:var(--shadow);
    display:flex;align-items:center;gap:12px}
  .ico{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex:none}
  .ico svg{width:22px;height:22px}
  .pill .lbl{font-size:.72rem;color:var(--muted)}
  .pill .val{font-size:1.18rem;font-weight:800;line-height:1.15;margin-top:1px}
  .tint-green{background:rgba(111,191,115,.16);color:var(--green-d)}
  .tint-blue{background:rgba(111,177,224,.18);color:#3f86bd}
  .tint-amber{background:rgba(240,163,94,.18);color:#d07f37}
  .tint-dark{background:rgba(51,65,58,.12);color:var(--dark)}
  .val.warn{color:#e2683f}

  /* moisture ring */
  .ring{--v:0;width:42px;height:42px;border-radius:50%;flex:none;
    background:conic-gradient(var(--green) calc(var(--v)*1%),#e6efe4 0);
    display:grid;place-items:center;position:relative}
  .ring::after{content:"";position:absolute;inset:5px;border-radius:50%;background:#fff}

  /* control card */
  .card{background:var(--card);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
  .card h3{margin:0 0 12px;font-size:.8rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px}
  select{appearance:none;width:100%;font-size:1rem;font-weight:600;color:var(--ink);
    background:#f2f7f0;border:none;border-radius:14px;padding:13px 14px;margin-bottom:12px}
  .toggle{width:52px;height:30px;border-radius:999px;background:#dbe6da;position:relative;
    cursor:pointer;transition:background .25s;flex:none}
  .toggle b{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;
    background:#fff;transition:left .25s;box-shadow:0 2px 5px rgba(0,0,0,.15)}
  .toggle.on{background:var(--green)} .toggle.on b{left:25px}
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  button{font-family:inherit;font-size:.98rem;font-weight:700;border:none;border-radius:16px;
    padding:15px;cursor:pointer;transition:transform .08s,opacity .2s}
  button:active{transform:scale(.97)}
  .b-water{background:var(--green);color:#fff}
  .b-stop{background:#fff;color:#e2683f;box-shadow:inset 0 0 0 2px rgba(226,104,63,.25)}
  button:disabled{opacity:.45;cursor:not-allowed}
  .foot{text-align:center;color:var(--muted);font-size:.72rem;margin:6px 0 2px}
</style>
</head>
<body>
<div class="app">

  <div class="top">
    <div class="hello">My Garden<b id="plantName">Loading...</b></div>
    <div class="badge" id="badge"><span class="dot"></span><span id="badgeTxt">...</span></div>
  </div>

  <div class="hero">
    <div class="title" id="heroTitle">Soil Moisture</div>
    <div class="sub" id="heroSub">waters below --%</div>
    <div class="scene" id="scene">
      <div class="glow"></div>
      <span class="spark" id="sp1">✦</span><span class="spark" id="sp2">✦</span><span class="spark" id="sp3">✦</span>
      <div class="drop"></div><div class="drop"></div><div class="drop"></div>
      <svg class="plant sway" width="180" height="200" viewBox="0 0 180 200" id="plantSvg">
        <!-- pot -->
        <path d="M55 150 L125 150 L118 196 L62 196 Z" fill="#c98b5e"/>
        <rect x="50" y="140" width="80" height="16" rx="6" fill="#dd9d6d"/>
        <!-- soil -->
        <ellipse cx="90" cy="150" rx="38" ry="8" fill="#5a3d2b"/>
        <!-- plant -->
        <g class="leaf-wrap">
          <rect class="stem" x="87" y="70" width="6" height="82" rx="3" fill="#4f9a54"/>
          <g transform="translate(82,88)">
            <path class="leaf" d="M8 62 C -34 54 -30 14 8 6 C 20 30 20 44 8 62 Z" fill="#6fbf73"/>
          </g>
          <g transform="translate(90,88) scale(-1,1)">
            <path class="leaf" d="M8 62 C -34 54 -30 14 8 6 C 20 30 20 44 8 62 Z" fill="#6fbf73"/>
          </g>
          <g transform="translate(82,58)">
            <path class="leaf" d="M8 52 C -26 46 -22 16 8 8 C 18 26 18 38 8 52 Z" fill="#79c97d"/>
          </g>
          <g transform="translate(90,58) scale(-1,1)">
            <path class="leaf" d="M8 52 C -26 46 -22 16 8 8 C 18 26 18 38 8 52 Z" fill="#79c97d"/>
          </g>
          <path class="leaf" transform="translate(84,44)" d="M6 34 C 0 10 12 2 6 -8 C 22 2 20 30 6 34 Z" fill="#83d187"/>
          <g class="face">
            <circle class="cheek" cx="80" cy="60" r="4"/>
            <circle class="cheek" cx="100" cy="60" r="4"/>
            <circle class="eye" cx="84" cy="54" r="2.5"/>
            <circle class="eye" cx="96" cy="54" r="2.5"/>
            <path class="mouth" d="M84 60 Q90 65 96 60"/>
          </g>
        </g>
      </svg>
    </div>
    <div class="mood" id="mood">&nbsp;</div>
  </div>

  <div class="pills">
    <div class="pill">
      <div class="ring" id="moistRing"></div>
      <div><div class="lbl">Soil Moisture</div><div class="val" id="moistVal">--%</div></div>
    </div>
    <div class="pill">
      <div class="ico tint-blue">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.7S5 10 5 14.5a7 7 0 0 0 14 0C19 10 12 2.7 12 2.7z"/></svg>
      </div>
      <div><div class="lbl">Water Tank</div><div class="val" id="waterVal">--</div></div>
    </div>
    <div class="pill">
      <div class="ico tint-amber">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z"/></svg>
      </div>
      <div><div class="lbl">Pump</div><div class="val" id="pumpVal">--</div></div>
    </div>
    <div class="pill">
      <div class="ico tint-dark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.5 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10z"/><path d="M2 21c0-3 1.85-5.36 5.08-6"/></svg>
      </div>
      <div><div class="lbl">Mode</div><div class="val" id="modeVal">--</div></div>
    </div>
  </div>

  <div class="card">
    <h3>Plant Profile</h3>
    <select id="plantSel"></select>
    <div class="row">
      <div><div style="font-weight:700">Auto Watering</div>
        <div class="lbl" style="color:var(--muted);font-size:.75rem">waters on its own when dry</div></div>
      <div class="toggle" id="autoTgl"><b></b></div>
    </div>
    <div class="btns">
      <button class="b-water" id="waterBtn">Water Now</button>
      <button class="b-stop" id="stopBtn">Stop Pump</button>
    </div>
  </div>

  <div class="foot" id="foot">connecting...</div>
</div>

<script>
const $ = id => document.getElementById(id);
let plantsLoaded = false;

async function api(path, opts){ try{ const r = await fetch(path, opts); return await r.json(); }catch(e){ return null; } }

async function control(action, value){
  await api('/api/control', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({action, value})});
  refresh();
}

function setPlant(d){
  if(!plantsLoaded && d.plants){
    d.plants.forEach((n,i)=>{ const o=document.createElement('option'); o.value=i; o.textContent=n; $('plantSel').appendChild(o); });
    plantsLoaded = true;
  }
  $('plantSel').value = d.plant;
}

function paintPlant(m, threshold, pumpOn){
  const svg = $('plantSvg'), scene = $('scene'), mouth = document.querySelector('.mouth'), mood = $('mood');
  const leaves = document.querySelectorAll('.leaf');
  let color, droop, happy = false, mouthD, moodTxt, moodCol;
  if(m >= threshold){
    color = ['#6fbf73','#79c97d','#83d187']; droop = 0; happy = true;
    mouthD = 'M84 60 Q90 66 96 60'; moodTxt = '😊 Feeling great!'; moodCol = '#4f9a54';
  } else if(m >= threshold - 15){
    color = ['#9cbf6a','#a7c76f','#b0d17a']; droop = 10;
    mouthD = 'M84 61 L96 61'; moodTxt = '😐 Getting thirsty...'; moodCol = '#c98b3a';
  } else {
    color = ['#c2a85a','#cbb166','#d1bb72']; droop = 22;
    mouthD = 'M84 63 Q90 57 96 63'; moodTxt = '😟 I need water!'; moodCol = '#e2683f';
  }
  leaves.forEach((l,i)=>{ l.style.fill = color[i % color.length]; l.style.transform = 'rotate('+droop+'deg)'; });
  svg.style.filter = m < threshold - 15 ? 'saturate(.7)' : 'none';
  if(mouth) mouth.setAttribute('d', mouthD);
  svg.classList.toggle('happy', happy);
  scene.classList.toggle('happy-scene', happy);
  scene.classList.toggle('watering', !!pumpOn);
  if(mood){ mood.textContent = moodTxt; mood.style.color = moodCol; }
}

async function refresh(){
  const d = await api('/api/status');
  if(!d){ $('foot').textContent = 'server offline'; return; }

  $('plantName').textContent = d.plantName;
  $('heroSub').textContent = 'waters below ' + d.threshold + '%';

  const m = Math.round(d.moisture);
  $('moistVal').textContent = m + '%';
  $('moistRing').style.setProperty('--v', m);

  $('waterVal').textContent = d.water ? 'OK' : 'LOW';
  $('waterVal').classList.toggle('warn', !d.water);

  $('pumpVal').textContent = d.pump ? 'Running' : 'Idle';
  $('modeVal').textContent = d.auto ? 'Auto' : 'Manual';

  const b = $('badge');
  b.className = 'badge ' + (d.online ? 'live' : (d.demo ? 'demo' : ''));
  $('badgeTxt').textContent = d.online ? 'Live' : (d.demo ? 'Demo' : 'Offline');

  $('autoTgl').classList.toggle('on', d.auto);
  $('waterBtn').disabled = !d.water || d.pump;
  $('stopBtn').disabled = !d.pump;

  setPlant(d);
  paintPlant(d.moisture, d.threshold, d.pump);

  $('foot').textContent = d.online ? 'live data from ESP32' : (d.demo ? 'demo data - waiting for ESP32' : 'ESP32 offline');
}

$('plantSel').addEventListener('change', e => control('plant', parseInt(e.target.value,10)));
$('autoTgl').addEventListener('click', () => control('auto'));
$('waterBtn').addEventListener('click', () => control('pump','on'));
$('stopBtn').addEventListener('click', () => control('pump','off'));

refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
